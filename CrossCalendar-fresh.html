<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>CrossCalendar</title><style>*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;margin:0 auto;padding:14px;max-width:700px;background:#f5f7fa;color:#202124}header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 18px}h1{font-size:23px;margin:0}.nav{display:flex;align-items:center;gap:5px}button{font:inherit;border:0;border-radius:10px;padding:10px;background:#e8eaed;color:#202124;cursor:pointer}#monthLabel{min-width:135px;font-weight:bold;font-size:17px}.card{background:white;border-radius:16px;padding:10px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekdays div{text-align:center;font-size:12px;color:#666;padding:8px 0;font-weight:bold}.day{min-height:54px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 1px;background:#f4f5f6;border-radius:9px}.day.blank{background:transparent}.day.today{outline:2px solid #4b7bec}.num{font-size:14px}.mark{font-size:19px;line-height:20px;font-weight:bold}.done .mark{color:#16803c}.notdone .mark{color:#d93025}.legend{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:15px 0;color:#555;font-size:13px}.note,footer{text-align:center;color:#777;font-size:12px;margin:12px 0}dialog{border:0;border-radius:16px;padding:20px;width:calc(100% - 30px);max-width:340px;box-shadow:0 8px 35px #0004}dialog::backdrop{background:#0006}dialog h2{margin:0 0 6px}#chosenDate{color:#666;margin:0 0 16px}.actions{display:grid;gap:10px}.actions button{text-align:left;padding:13px}.doneBtn{background:#e1f3e6;color:#12652e}.notdoneBtn{background:#fde7e7;color:#b3261e}.clearBtn{background:#eee}@media(max-width:380px){body{padding:9px}.day{min-height:47px}#monthLabel{min-width:120px}}</style></head><body><header><h1>CrossCalendar</h1><div class="nav"><button id="prev" aria-label="Previous month">‹</button><button id="monthLabel"></button><button id="next" aria-label="Next month">›</button></div></header><div class="card"><div class="weekdays"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><div class="days" id="days"></div></div><div class="legend"><span><b style="color:#16803c">✓</b> Done</span><span><b style="color:#d93025">✕</b> Not done</span><span>Tap a date to mark it</span></div><p class="note">Your marks are saved on this device.</p><dialog id="picker"><h2>Mark this date</h2><p id="chosenDate"></p><div class="actions"><button class="doneBtn" id="markDone">✓ &nbsp; Done</button><button class="notdoneBtn" id="markNotDone">✕ &nbsp; Not done</button><button class="clearBtn" id="clearMark">Clear mark</button></div></dialog><footer>CrossCalendar · Simple daily tracking</footer><script>(()=>{const storageKey='crosscalendar-marks-v1';let marks={};try{marks=JSON.parse(localStorage.getItem(storageKey)||'{}')||{}}catch(e){}const now=new Date();let year=now.getFullYear(),month=now.getMonth(),selected='';const daysEl=document.getElementById('days'),label=document.getElementById('monthLabel'),picker=document.getElementById('picker');const pad=n=>String(n).padStart(2,'0'),keyFor=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;function save(){try{localStorage.setItem(storageKey,JSON.stringify(marks))}catch(e){alert('Could not save marks on this device.')}}function render(){label.textContent=new Date(year,month,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});daysEl.innerHTML='';const first=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate();for(let i=0;i<first;i++){const b=document.createElement('div');b.className='day blank';daysEl.appendChild(b)}for(let d=1;d<=count;d++){const key=keyFor(year,month,d),status=marks[key],b=document.createElement('button');b.className='day'+(status==='done'?' done':status==='notdone'?' notdone':'');if(year===now.getFullYear()&&month===now.getMonth()&&d===now.getDate())b.classList.add('today');const num=document.createElement('span');num.className='num';num.textContent=d;b.appendChild(num);const mark=document.createElement('span');mark.className='mark';mark.textContent=status==='done'?'✓':status==='notdone'?'✕':'';b.appendChild(mark);b.onclick=()=>openPicker(key,d);daysEl.appendChild(b)}}function openPicker(key,d){selected=key;document.getElementById('chosenDate').textContent=new Date(year,month,d).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});picker.showModal()}function setMark(value){if(value)marks[selected]=value;else delete marks[selected];save();picker.close();render()}document.getElementById('prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};document.getElementById('next').onclick=()=>{month++;if(month>11){month=0;year++}render()};document.getElementById('markDone').onclick=()=>setMark('done');document.getElementById('markNotDone').onclick=()=>setMark('notdone');document.getElementById('clearMark').onclick=()=>setMark('');render()})();</script></body></html>
